# MSCF-YOLO26 ablation: SSFF neck plus the P2 small-object detection head.

nc: 80
end2end: True
reg_max: 1
depth_multiple: 0.50
width_multiple: 0.50

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[6, -1], 1, SSFF, [512, 0]]
  - [-1, 1, CEM, [512, 0.5, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[4, -1], 1, SSFF, [256, 0]]
  - [-1, 1, CEM, [256, 0.5, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[2, -1], 1, SSFF, [128, 0]]
  - [-1, 1, CEM, [128, 0.5, True]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[16, -1], 1, SSFF, [256, 0]]
  - [-1, 1, CEM, [256, 0.5, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[13, -1], 1, SSFF, [512, 0]]
  - [-1, 1, CEM, [512, 0.5, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[10, -1], 1, SSFF, [1024, 0]]
  - [-1, 1, CEM, [1024, 0.5, True]]

  - [[19, 22, 25, 28], 1, Detect, [nc]]
